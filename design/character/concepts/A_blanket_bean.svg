    <ellipse id="arm_r" cx="99" cy="96" rx="7" ry="10" transform="rotate(-12 99 96)"/>
  </g>
  <g id="body">
    <path d="M30 102 C20 70 34 38 64 36 C94 38 108 70 98 102 C92 116 36 116 30 102 Z" fill="#F4B97A" stroke="#2D2A3E" stroke-width="3" stroke-linejoin="round"/>
    <ellipse id="cheek_l" cx="40" cy="88" rx="6" ry="4" fill="#E8806F" opacity="0.7"/>
    <ellipse id="cheek_r" cx="88" cy="88" rx="6" ry="4" fill="#E8806F" opacity="0.7"/>
  </g>
