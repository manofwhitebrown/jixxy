name: CI

on:
  push:
    branches: [main]
    # Docs-only commits do not build Android or trigger the emulator/latest workflows.
    # They still get the cheap secret/ownership scan from docs-guards.yml.
    paths-ignore:
      - 'coord/**'
      - 'qa/**'
      - 'design/**'
      - 'growth/**'
      - 'store/**'
      - 'content/**/*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'coord/**'
      - 'qa/**'
      - 'design/**'
      - 'growth/**'
      - 'store/**'
      - '**/*.md'

# Each commit on main gets its own run, so rapid pushes by several roles are not
# cancelled before they produce a verdict. Only superseded PR runs are cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guards:
    name: Guards (secrets, ownership, lines)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: No secrets / forbidden files
        run: bash scripts/check_no_secrets.sh
      - name: Ownership (warning only)
        run: bash scripts/check_ownership.sh || true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Asset budget (blocking since the first clean run, 2026-11-07)
        env:
          STRICT: '1'
        run: bash scripts/check_assets.sh
      - name: Line bank (python fallback; Gradle task takes over when it exists)
        run: python3 scripts/validate_lines.py
      - name: Line lint + coverage matrix (WRITER tools; errors fail, warnings are annotations)
        run: bash scripts/run_content_checks.sh

  build:
    name: Build, test, lint, privacy guards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # scripts/version_code.sh counts commits
      - name: Version code (commit count)
        id: ver
        run: echo "code=$(bash scripts/version_code.sh)" >> "$GITHUB_OUTPUT"
      - name: Detect Gradle wrapper
        id: gradle
        run: |
          if [ -x ./gradlew ] || [ -f ./gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::./gradlew not found yet (PLATFORM scaffold pending). Build steps skipped, not failed."
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.gradle.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.gradle.outputs.present == 'true'
      - name: Dependency guard
        run: bash scripts/check_dependencies.sh
      # Test, lint and assemble run as separate steps with --continue so one failure does not hide
      # the others. Each log is converted to ::error:: annotations (readable through the Checks API
      # by agents that cannot download raw logs). continue-on-error + the final gate keep the job red.
      - name: Unit tests
        id: unit
        if: steps.gradle.outputs.present == 'true'
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew test --continue --stacktrace 2>&1 | tee build-test.log
      - name: Line bank (Gradle task)
        id: lines
        if: steps.gradle.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :engine:validateLines --stacktrace 2>&1 | tee build-lines.log
      - name: Lint
        id: lint
        if: steps.gradle.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew lint --continue --stacktrace 2>&1 | tee build-lint.log
      - name: Assemble debug APK
        id: assemble
        if: steps.gradle.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug -PversionCode=${{ steps.ver.outputs.code }} --continue --stacktrace 2>&1 | tee build-assemble.log
      - name: Unit-test summary (counts + failing tests as annotations)
        if: always() && steps.gradle.outputs.present == 'true'
        run: python3 scripts/ci_test_summary.py
      - name: Engine coverage gate (rules and selector must stay >= 85% line coverage; measured 99% and 98% on 2026-11-07)
        if: always() && steps.gradle.outputs.present == 'true'
        env:
          COVERAGE_MIN: '85'
          COVERAGE_PACKAGES: rules,selector
        run: python3 scripts/ci_coverage.py
      - name: Upload coverage report (main pushes only)
        if: always() && steps.gradle.outputs.present == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-coverage-${{ github.sha }}
          path: |
            engine/build/reports/jacoco
            engine/build/reports/coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Report failures as annotations
        if: always() && steps.gradle.outputs.present == 'true'
        run: |
          [ "${{ steps.unit.outcome }}" = "failure" ] && python3 scripts/ci_annotate_errors.py build-test.log "Unit tests"
          [ "${{ steps.lint.outcome }}" = "failure" ] && python3 scripts/ci_annotate_errors.py build-lint.log "Lint"
          [ "${{ steps.lines.outcome }}" = "failure" ] && python3 scripts/ci_annotate_errors.py build-lines.log "Line bank"
          [ "${{ steps.assemble.outcome }}" = "failure" ] && python3 scripts/ci_annotate_errors.py build-assemble.log "Assemble"
          exit 0
      - name: Manifest guard (merged debug manifest)
        if: steps.assemble.outcome == 'success'
        run: bash scripts/check_manifest.sh debug
      - name: Resolved dependency guard (what actually ships, transitive libraries included)
        if: steps.assemble.outcome == 'success'
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --quiet > resolved-deps.txt
          bash scripts/check_resolved_deps.sh resolved-deps.txt
      - name: Manifest guard (merged RELEASE manifest)
        if: steps.assemble.outcome == 'success'
        run: |
          ./gradlew :app:processReleaseManifest -PversionCode=${{ steps.ver.outputs.code }} --stacktrace
          bash scripts/check_manifest.sh release
      - name: Upload debug APK (main pushes only; latest.yml and the emulator need it)
        if: steps.assemble.outcome == 'success' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jixxy-debug-${{ github.sha }}.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Signing certificate must match the committed debug key
        if: steps.assemble.outcome == 'success'
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          bash scripts/check_apk_cert.sh "$apk" --keystore app/debug.keystore jixxydebug android
          echo "versionCode=${{ steps.ver.outputs.code }}"
      - name: versionCode inside the APK must equal the commit count
        if: steps.assemble.outcome == 'success'
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          got=$(bash scripts/apk_version_code.sh "$apk")
          echo "APK versionCode=$got expected=${{ steps.ver.outputs.code }}"
          [ "$got" = "${{ steps.ver.outputs.code }}" ]
      - name: Gate (fail if tests, line bank, lint or assemble failed)
        if: always() && steps.gradle.outputs.present == 'true'
        run: |
          echo "unit=${{ steps.unit.outcome }} lines=${{ steps.lines.outcome }} lint=${{ steps.lint.outcome }} assemble=${{ steps.assemble.outcome }}"
          [ "${{ steps.unit.outcome }}" = "success" ] && [ "${{ steps.lines.outcome }}" = "success" ] && [ "${{ steps.lint.outcome }}" = "success" ] && [ "${{ steps.assemble.outcome }}" = "success" ]
