name: Latest

# After every GREEN CI run on main, republish the same debug APK that CI built as the rolling
# pre-release "latest". One stable link for the Owner's phone:
#   https://github.com/manofwhitebrown/jixxy/releases/download/latest/jixxy-latest.apk
# Numbered releases (tags v*) are handled by release.yml and are never touched here.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # create/update the "latest" release and move its tag
  actions: read     # download the APK artifact of the CI run

concurrency:
  group: latest
  cancel-in-progress: false

jobs:
  publish:
    name: Publish rolling latest pre-release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip only if "latest" is already newer
        id: tip
        run: |
          # With several people pushing all day, "skip when main moved on" would starve publishing.
          # Instead compare commit counts: never replace a newer published build with an older one.
          mine=$(bash scripts/version_code.sh)
          cur=$(gh release view latest --json body --jq .body 2>/dev/null | sed -n 's/.*versionCode: *\([0-9][0-9]*\).*/\1/p' | head -1 || true)
          echo "this build: ${mine}, published latest: ${cur:-none}"
          if [ -n "${cur:-}" ] && [ "$cur" -gt "$mine" ]; then
            echo "::notice::Published latest (${cur}) is newer than this build (${mine}). Skipping ${SHA:0:7}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the CI APK
        if: steps.tip.outputs.skip != 'true'
        run: |
          set -u
          fail() { echo "::error title=latest download::$1"; exit 1; }
          list=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" 2>&1) || fail "listing artifacts failed: $(echo "$list" | head -c 400)"
          art=$(echo "$list" | python3 -c 'import sys,json; a=[x for x in json.load(sys.stdin)["artifacts"] if x["name"].startswith("jixxy-debug-") and not x["expired"]]; print(a[0]["id"] if a else "")')
          [ -n "$art" ] || fail "no jixxy-debug-* artifact in CI run ${RUN_ID}. Artifacts seen: $(echo "$list" | python3 -c 'import sys,json; print([x["name"] for x in json.load(sys.stdin)["artifacts"]])')"
          mkdir -p dl dist
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art}/zip" > dl/a.zip 2>dl/err.txt || fail "zip download failed: $(head -c 400 dl/err.txt)"
          unzip -q -o dl/a.zip -d dl || fail "unzip failed"
          apk=$(find dl -name '*.apk' | head -1)
          [ -n "$apk" ] || fail "no .apk inside the artifact"
          cp "$apk" dist/jixxy-latest.apk
          (cd dist && sha256sum jixxy-latest.apk > jixxy-latest.apk.sha256)

      - name: Signing certificate
        if: steps.tip.outputs.skip != 'true'
        run: bash scripts/check_apk_cert.sh dist/jixxy-latest.apk --keystore app/debug.keystore jixxydebug android

      - name: Publish release "latest"
        if: steps.tip.outputs.skip != 'true'
        run: |
          set -eu
          code=$(bash scripts/version_code.sh)
          subject=$(git log -1 --format=%s "$SHA")
          {
            echo "Rolling build of \`main\` (debug-signed, testing only). Replaced on every green push."
            echo
            echo "- Commit: \`${SHA:0:7}\` — ${subject}"
            echo "- Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- versionCode: ${code}"
            echo "- SHA-256: see \`jixxy-latest.apk.sha256\`"
            echo
            echo "Install over a previous build; if Android refuses, the versionCode or signing key differs: see qa/RELEASE_SIGNING.md."
          } > dist/notes.md
          if gh release view latest >/dev/null 2>&1; then
            # move the tag to this commit first, then replace the assets and notes
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$SHA" -F force=true >/dev/null
            gh release upload latest dist/jixxy-latest.apk dist/jixxy-latest.apk.sha256 --clobber
            gh release edit latest --title "Jixxy latest (main)" --notes-file dist/notes.md --prerelease
          else
            gh release create latest dist/jixxy-latest.apk dist/jixxy-latest.apk.sha256 \
              --target "$SHA" --title "Jixxy latest (main)" --notes-file dist/notes.md --prerelease
          fi
          echo "Link: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/jixxy-latest.apk"
