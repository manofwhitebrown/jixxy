name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Guards
        run: |
          bash scripts/check_no_secrets.sh
          bash scripts/check_dependencies.sh
          python3 scripts/validate_lines.py

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decide signing mode
        id: sign
        env:
          KS_B64: ${{ secrets.JIXXY_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.JIXXY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JIXXY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JIXXY_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "::notice::Release secrets present: signing with the release key."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::notice::Release secrets absent: building with the debug keystore."
          fi

      - name: Version code (commit count)
        id: ver
        run: echo "code=$(bash scripts/version_code.sh)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          JIXXY_KEYSTORE_B64: ${{ secrets.JIXXY_KEYSTORE_B64 }}
          JIXXY_KEYSTORE_PASSWORD: ${{ secrets.JIXXY_KEYSTORE_PASSWORD }}
          JIXXY_KEY_ALIAS: ${{ secrets.JIXXY_KEY_ALIAS }}
          JIXXY_KEY_PASSWORD: ${{ secrets.JIXXY_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            # app/build.gradle.kts decodes JIXXY_KEYSTORE_B64 itself (into app/build, never committed); nothing is printed.
            ./gradlew test assembleRelease -PversionCode=${{ steps.ver.outputs.code }} --stacktrace
            APK_DIR=app/build/outputs/apk/release
          else
            ./gradlew test assembleDebug -PversionCode=${{ steps.ver.outputs.code }} --stacktrace
            APK_DIR=app/build/outputs/apk/debug
          fi
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"

      - name: Manifest guard (variant that was built)
        run: |
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then variant=release; else variant=debug; fi
          ./gradlew :app:process${variant^}Manifest -PversionCode=${{ steps.ver.outputs.code }} --stacktrace
          bash scripts/check_manifest.sh "$variant"

      - name: Signing certificate must match the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          apk=$(ls "$APK_DIR"/*.apk | head -1)
          if [ "${{ steps.sign.outputs.mode }}" = "debug" ]; then
            bash scripts/check_apk_cert.sh "$apk" --keystore app/debug.keystore jixxydebug android
          else
            bash scripts/apk_cert.sh "$apk" >/dev/null   # prints the digest into the log; verifies the signature
            echo "::notice::Release-key build; compared with the previous release below."
          fi
          new_vc=$(bash scripts/apk_version_code.sh "$apk")
          echo "versionCode of this build: $new_vc (Gradle was given ${{ steps.ver.outputs.code }})"
          [ "$new_vc" = "${{ steps.ver.outputs.code }}" ] || { echo "::error title=versionCode mismatch::APK says $new_vc, workflow passed ${{ steps.ver.outputs.code }}"; exit 1; }
          # Only numbered releases (v1.2.3-...) count as "previous release". "latest" and "ci-evidence" are rolling
          # pre-releases: ci-evidence has no APK at all, and latest is checked for versionCode only (below).
          prev=$(gh release list --limit 30 --json tagName,isDraft --jq '.[] | select(.isDraft|not) | .tagName' | grep -E '^v[0-9]' | grep -vx "$TAG" | head -1 || true)
          fetch_apk() {  # $1 = tag, $2 = dir ; prints the APK path or nothing
            mkdir -p "$2"; gh release download "$1" --pattern '*.apk' --dir "$2" >/dev/null 2>&1 || true
            ls "$2"/*.apk 2>/dev/null | head -1 || true
          }
          check_vc() {  # $1 = tag, $2 = apk path, $3 = "strict" (must be higher) or "notlower"
            local old_vc; old_vc=$(bash scripts/apk_version_code.sh "$2")
            if [ "$new_vc" -gt "$old_vc" ]; then echo "versionCode $new_vc > $old_vc ($1): ok"
            elif [ "$3" = "notlower" ] && [ "$new_vc" -eq "$old_vc" ]; then
              echo "::notice::$TAG has the same versionCode ($new_vc) as $1: it was tagged on the commit $1 was built from. Fine, but people on $1 will not be offered an update."
            else echo "::error title=versionCode not higher::$TAG has versionCode $new_vc but $1 has $old_vc; phones would refuse the update."; exit 1; fi
          }
          lat=$(fetch_apk latest prev-latest)
          if [ -n "$lat" ]; then check_vc latest "$lat" notlower; else echo "::notice::No APK on the latest release to compare versionCode with."; fi
          if [ -z "$prev" ]; then echo "::notice::No earlier numbered release to compare with."; exit 0; fi
          old=$(fetch_apk "$prev" prev)
          if [ -z "$old" ]; then echo "::notice::Earlier release $prev has no APK; nothing to compare."; exit 0; fi
          check_vc "$prev" "$old" strict
          if bash scripts/check_apk_cert.sh "$apk" --apk "$old"; then
            echo "Same signing certificate as $prev."
          else
            echo "::error title=Key changed since $prev::Users of $prev cannot update to $TAG without uninstalling."
            [ "${ALLOW_KEY_CHANGE:-}" = "1" ] || exit 1
          fi

      - name: Name APK, checksum, notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          apk=$(ls "$APK_DIR"/*.apk | head -1)
          mkdir -p dist
          cp "$apk" "dist/jixxy-${TAG}.apk"
          (cd dist && sha256sum "jixxy-${TAG}.apk" > "jixxy-${TAG}.apk.sha256")

          ver="${TAG#v}"
          : > dist/notes.md
          if [ -f CHANGELOG.md ]; then
            # section from "## [x.y.z]" or "## x.y.z" up to the next "## "
            awk -v v="$ver" '
              /^## / { if (found) exit; if (index($0, v)) { found=1; next } }
              found { print }
            ' CHANGELOG.md > dist/notes.md || true
          fi
          [ -s dist/notes.md ] || echo "No changelog entry found for ${TAG}." > dist/notes.md
          if [ "${{ steps.sign.outputs.mode }}" = "debug" ]; then
            printf '\n> Signed with the shared debug keystore (testing build, not a store release).\n' >> dist/notes.md
          fi
          printf '\nSHA-256: see `jixxy-%s.apk.sha256`.\n' "$TAG" >> dist/notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/jixxy-${TAG}.apk" "dist/jixxy-${TAG}.apk.sha256" \
            --title "Jixxy ${TAG}" --notes-file dist/notes.md --prerelease
