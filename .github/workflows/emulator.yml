name: Emulator

# After a green CI run on main: install that CI's debug APK on emulators (API 26, 30, 34, 35),
# grant the special permissions with adb, launch the app, and collect screenshots + logcat.
# Evidence is uploaded as artifacts here and published by T-V1-DEVOPS-2 (ci-evidence release).
# Instrumented tests (connectedDebugAndroidTest) run too, as soon as app/src/androidTest exists.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI run id whose APK to test (blank = newest green CI run on main)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: emulator-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator API ${{ matrix.api }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34, 35]
    env:
      GH_TOKEN: ${{ github.token }}
      PKG: app.jixxy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Find the CI run and its APK
        id: ci
        run: |
          run_id="${{ github.event.workflow_run.id || github.event.inputs.run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow CI --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          sha=$(gh run view "$run_id" --json headSha -q .headSha)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p apk && gh run download "$run_id" -n "jixxy-debug-$sha.apk" -D apk
          ls -l apk; echo "::notice::Testing CI run $run_id, commit $sha"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Smoke on emulator (install, grant, launch, screenshot, logcat)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator_smoke.sh evidence apk
      - name: Upload evidence (screenshots, logcat)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-evidence-api${{ matrix.api }}-${{ steps.ci.outputs.sha }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14

  publish-evidence:
    name: Publish evidence to the ci-evidence release
    needs: emulator
    if: always() && needs.emulator.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # create/update the rolling "ci-evidence" pre-release (assets + notes only)
      actions: read
    concurrency:
      group: ci-evidence
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download evidence of this run
        run: |
          mkdir -p dl evidence
          gh run download "${{ github.run_id }}" -D dl --repo "${{ github.repository }}" -p 'emulator-evidence-*' || echo "::warning::no evidence artifacts"
          for d in dl/emulator-evidence-api*; do
            [ -d "$d" ] || continue
            api=$(echo "$d" | sed -E 's|.*evidence-(api[0-9]+)-.*|\1|')
            for f in "$d"/*; do cp "$f" "evidence/$api-$(basename "$f")"; done
          done
          ls -l evidence
      - name: Replace the ci-evidence release assets
        run: |
          trap 'echo "::error::failed at line $LINENO: $BASH_COMMAND"' ERR
          set -E
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          notes="Rolling evidence from the newest emulator run. Commit $sha, run ${{ github.run_id }}. Files: apiNN-<name>.png (screenshots), apiNN-logcat.txt, apiNN-crashes.txt (only if a crash was found)."
          gh release view ci-evidence --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create ci-evidence --repo "${{ github.repository }}" --prerelease --target main --title "CI evidence (rolling)" --notes "$notes"
          gh release edit ci-evidence --repo "${{ github.repository }}" --prerelease --notes "$notes"
          for a in $(gh release view ci-evidence --repo "${{ github.repository }}" --json assets -q '.assets[].name'); do
            gh release delete-asset ci-evidence "$a" --repo "${{ github.repository }}" -y
          done
          find evidence -type f -empty -print -delete   # GitHub rejects zero-byte assets
          for f in evidence/*; do
            gh release upload ci-evidence "$f" --repo "${{ github.repository }}" --clobber || echo "::warning::upload failed: $f"
          done
          echo "::notice::https://github.com/${{ github.repository }}/releases/tag/ci-evidence"
