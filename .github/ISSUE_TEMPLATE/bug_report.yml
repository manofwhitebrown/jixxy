name: Bug report
description: Something broke
labels: [bug]
body:
  - type: input
    id: device
    attributes: {label: Phone model, placeholder: "Redmi Note 12"}
    validations: {required: true}
  - type: input
    id: android
    attributes: {label: Android version and OEM skin, placeholder: "Android 14, HyperOS"}
    validations: {required: true}
  - type: input
    id: build
    attributes: {label: Jixxy version or commit}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected vs what happened}
    validations: {required: true}
